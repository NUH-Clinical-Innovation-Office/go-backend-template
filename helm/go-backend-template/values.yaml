# Default values for go-backend-template

image:
  repository: ghcr.io/your-org/go-backend-template
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# API server configuration
api:
  enabled: true
  port: 8080
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # GOMEMLIMIT (Go runtime soft memory limit). Set to ~80% of resources.limits.memory
  # to give the runtime headroom before the kernel OOM-kills the container.
  # For 256Mi limit: 256 * 1024 * 1024 * 0.80 = 214958080 bytes.
  # Update this value if you change resources.limits.memory.
  gomemlimit: "214958080"
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# NetworkPolicy — restrict who can reach the API pods.
# Requires a CNI that enforces NetworkPolicy (e.g. VPC CNI with network policy enabled).
networkPolicy:
  enabled: false
  # Selector value (app.kubernetes.io/name) of the client pods allowed to call the API.
  # Leave empty to rely solely on extraIngress.
  frontendPodLabelName: ""
  # Additional ingress rules appended verbatim (e.g. Prometheus scraping /metrics on :8080).
  extraIngress: []

# External PostgreSQL (RDS or other managed DB)
externalDatabase:
  host: ""
  port: 5432
  database: app
  username: postgres
  sslMode: "require"
  existingSecret: "go-backend-template-db"
  existingSecretPasswordKey: "password"

# JWT signing secret — synced from a secret store (e.g. External Secrets Operator)
jwt:
  existingSecret: "go-backend-template-jwt"
  existingSecretKey: "JWT_SECRET_KEY"

# Health checks
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Environment variables
env:
  - name: SERVER_PORT
    value: "8080"
  - name: LOG_LEVEL
    value: "info"
  - name: LOG_FORMAT
    value: "json"
  - name: ENVIRONMENT
    value: "development"
  - name: SERVICE_NAME
    value: "go-backend-template"
  - name: SERVICE_VERSION
    value: "0.1.0"
  # Base default: tracing OFF. Enabled per-environment in values-development.yaml.
  - name: TRACING_ENABLED
    value: "false"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://opentelemetry-collector.nuh-cio.svc.cluster.local:4317"
  - name: OTEL_EXPORTER_OTLP_INSECURE
    value: "true"

envFrom: []
