{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-backend-template.fullname" . }}
  labels:
    {{- include "go-backend-template.apiLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.api.metricsPort | default 9464 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "go-backend-template.apiSelectorLabels" . | nindent 4 }}
{{- end }}
