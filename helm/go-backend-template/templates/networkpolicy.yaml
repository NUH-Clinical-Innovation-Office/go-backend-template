{{- if and .Values.api.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "go-backend-template.fullname" . }}
  labels:
    {{- include "go-backend-template.apiLabels" . | nindent 4 }}
spec:
  # Default-deny ingress; only the rules below are allowed.
  podSelector:
    matchLabels:
      {{- include "go-backend-template.apiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- with .Values.networkPolicy.frontendPodLabelName }}
    # Allow the named frontend/client to reach the API port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.api.port }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
